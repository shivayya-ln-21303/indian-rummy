# ============================================================
# Nginx reverse proxy for Indian Rummy
# Handles: HTTP, WebSocket upgrade, optional HTTPS
# ============================================================

worker_processes auto;
events { worker_connections 4096; }

http {
    include      mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Rate limiting — 20 req/s per IP, burst 40
    limit_req_zone $binary_remote_addr zone=game_api:10m rate=20r/s;

    # ----------------------------------------------------------------
    # Upstream backends
    # ----------------------------------------------------------------
    upstream spring_backend {
        server backend:8080;
        keepalive 32;
    }

    upstream react_frontend {
        server frontend:80;
        keepalive 16;
    }

    # ----------------------------------------------------------------
    # HTTP server (port 80)
    # Comment out the redirect block if you don't use HTTPS yet
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Uncomment to redirect HTTP → HTTPS in production:
        # return 301 https://$host$request_uri;

        # ----- WebSocket endpoint -----
        location /ws/ {
            proxy_pass         http://spring_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;    # keep WS connections alive
            proxy_send_timeout 3600s;
        }

        # ----- REST API -----
        location /api/ {
            limit_req zone=game_api burst=40 nodelay;
            proxy_pass         http://spring_backend;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 30s;
        }

        # ----- React SPA (all other routes) -----
        location / {
            proxy_pass         http://react_frontend;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 30s;
        }
    }

    # ----------------------------------------------------------------
    # HTTPS server (port 443) — uncomment when TLS certs are ready
    # ----------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /ws/  { ... same as above ... }
    #     location /api/ { ... same as above ... }
    #     location /     { ... same as above ... }
    # }
}

