spring.application.name=indian-rummy

# Render injects $PORT at runtime; fall back to 8080 for local dev
server.port=${PORT:8080}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL

# Logging
logging.level.com.cardgame=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{30} - %msg%n

# Game settings
game.max-players=4
game.cards-per-player=13
game.room-inactive-minutes=30
game.cleanup-interval-ms=300000
game.turn-timeout-seconds=30
game.max-rooms=1000
